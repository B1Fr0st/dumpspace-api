[package]
name = "dumpspace-macros"
version = "1.0.1"
edition = "2024"
description = "Compile-time offset resolution macros for Dumpspace API."
license = "MIT"
repository = "https://github.com/B1Fr0st/dumpspace-api"

[lib]
proc-macro = true

[dependencies]
syn = "2"
quote = "1"
proc-macro2 = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
flate2 = "1"
serde = "1"
serde_derive = "1"
serde_json = "1"
